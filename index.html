<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COG Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>
  <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet@2.0.0/dist/georaster-layer-for-leaflet.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column;
      height: 100vh; background: #1a1a2e; color: #e0e0e0;
    }

    /* ── Header ── */
    header {
      padding: 7px 12px; background: #16213e;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      border-bottom: 1px solid #0f3460; z-index: 1000;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: #e94560; white-space: nowrap; }
    #url-input {
      flex: 1; min-width: 160px; padding: 5px 8px; border-radius: 5px;
      border: 1px solid #0f3460; background: #0f3460; color: #e0e0e0; font-size: 0.83rem;
    }
    #url-input:focus { outline: none; border-color: #e94560; }
    #slot-select {
      background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a80;
      border-radius: 5px; padding: 5px 6px; font-size: 0.8rem;
    }
    #status { font-size: 0.75rem; color: #aaa; flex-shrink: 0;
              max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status.error { color: #e94560; }
    #status.ok    { color: #4caf50; }

    /* ── Buttons ── */
    button {
      padding: 5px 11px; border-radius: 5px; border: none;
      cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: background .15s;
    }
    .btn-primary  { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #c73652; }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; }
    .btn-secondary:hover { background: #1a4a80; }
    .btn-sm { padding: 3px 7px; font-size: 0.72rem; }

    /* ── Layout ── */
    .body-wrap { flex: 1; display: flex; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 252px; min-width: 252px; background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex; flex-direction: column; overflow-y: auto; z-index: 500;
    }
    .sb-section { border-bottom: 1px solid #0f3460; padding: 9px 11px; }
    .sb-section h3 {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: .06em; color: #777; margin-bottom: 7px;
    }

    /* ── Preset row ── */
    .preset-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .slot-badge {
      width: 15px; height: 15px; border-radius: 3px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 800; flex-shrink: 0; color: #fff;
    }
    .badge-A { background: #e94560; }
    .badge-B { background: #0099dd; }
    .badge-C { background: #33cc77; color: #111; }

    /* ── Layer rows ── */
    .layer-row {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 0; min-height: 26px;
    }
    .layer-name {
      flex: 1; font-size: 0.78rem; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: #888;
    }
    .layer-name.loaded { color: #ddd; font-weight: 500; }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.85rem; padding: 2px 3px; color: #aaa; border-radius: 3px;
    }
    .icon-btn:hover { background: #0f3460; color: #e0e0e0; }
    .icon-btn.dim { opacity: 0.3; }

    /* ── Layer settings ── */
    .layer-settings {
      display: none; padding: 5px 0 5px 20px;
      flex-direction: column; gap: 6px; font-size: 0.74rem;
    }
    .layer-settings.open { display: flex; }
    .layer-settings label { color: #999; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .ls-select {
      background: #0f3460; color: #e0e0e0;
      border: 1px solid #1a4a80; border-radius: 3px; padding: 1px 4px; font-size: 0.72rem;
    }
    .ls-range { width: 70px; }
    .ls-num {
      width: 50px; background: #0f3460; color: #e0e0e0;
      border: 1px solid #1a4a80; border-radius: 3px; padding: 1px 4px;
      font-size: 0.72rem; text-align: center;
    }
    .stretch-params { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: #888; }
    .stretch-params span { font-size: 0.68rem; }

    /* ── Colormap preview ── */
    .cmap-row { display: flex; align-items: center; gap: 5px; }
    .cmap-preview {
      height: 13px; border-radius: 2px; flex-shrink: 0;
      border: 1px solid #1a4a80; display: block;
    }

    /* ── Basemap ── */
    .bm-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; font-size: 0.78rem; }
    .bm-row input[type=radio], .bm-row input[type=checkbox] { accent-color: #e94560; }
    .wms-sub { padding-left: 2px; margin-top: 5px; }
    .wms-sub select {
      background: #0f3460; color: #e0e0e0;
      border: 1px solid #1a4a80; border-radius: 3px;
      padding: 2px 4px; font-size: 0.72rem; width: 100%; margin-top: 3px;
    }
    .wms-sub .op-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.72rem; color: #888; }
    .wms-sub input[type=range] {
      background: #0f3460; border: 1px solid #1a4a80; border-radius: 3px; width: 75px;
    }

    /* ── Map ── */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* ── Info box ── */
    #info-box {
      position: absolute; bottom: 28px; right: 8px;
      background: rgba(22,33,62,0.94); border: 1px solid #0f3460;
      border-radius: 6px; padding: 7px 11px; font-size: 0.74rem;
      z-index: 900; max-width: 220px; pointer-events: none;
    }
    #info-box table { border-collapse: collapse; }
    #info-box td { padding: 1px 6px 1px 0; }
    #info-box td:first-child { color: #888; }
  </style>
</head>
<body>

<header>
  <h1>COG Viewer</h1>
  <input id="url-input" type="text" placeholder="Cloud Optimized GeoTIFF URL…" />
  <select id="slot-select">
    <option value="A">→ Slot A</option>
    <option value="B">→ Slot B</option>
    <option value="C">→ Slot C</option>
  </select>
  <button id="load-btn" class="btn-primary">Load</button>
  <span id="status">Ready.</span>
</header>

<div class="body-wrap">

  <!-- ══ SIDEBAR ══ -->
  <div id="sidebar">

    <!-- Presets -->
    <div class="sb-section">
      <h3>NSW Wetlands Presets</h3>
      <div class="preset-row">
        <button class="btn-secondary btn-sm" id="pre-A"
          data-slot="A" data-url="https://nswetlands-mapping.s3.us-east-2.amazonaws.com/COG/GEI_cog.tif">
          <span class="slot-badge badge-A">A</span> GEI
        </button>
        <button class="btn-secondary btn-sm" id="pre-B"
          data-slot="B" data-url="https://nswetlands-mapping.s3.us-east-2.amazonaws.com/COG/PDEP_cog.tif">
          <span class="slot-badge badge-B">B</span> PDEP
        </button>
        <button class="btn-secondary btn-sm" id="pre-C"
          data-slot="C" data-url="https://nswetlands-mapping.s3.us-east-2.amazonaws.com/COG/DTW_cog.tif">
          <span class="slot-badge badge-C">C</span> DTW
        </button>
        <button class="btn-secondary btn-sm" id="pre-all" style="margin-left:auto">Load All</button>
      </div>
    </div>

    <!-- Layers A / B / C -->
    <div class="sb-section">
      <h3>Layers</h3>

      <div class="layer-row">
        <span class="slot-badge badge-A">A</span>
        <span class="layer-name" id="name-A">Empty</span>
        <button class="icon-btn" id="vis-A"    title="Toggle visibility">👁</button>
        <button class="icon-btn btn-sm" id="expand-A" title="Symbolization">⚙</button>
        <button class="icon-btn btn-sm" id="clear-A"  title="Remove">✕</button>
      </div>
      <div class="layer-settings" id="settings-A"></div>

      <div class="layer-row">
        <span class="slot-badge badge-B">B</span>
        <span class="layer-name" id="name-B">Empty</span>
        <button class="icon-btn" id="vis-B"    title="Toggle visibility">👁</button>
        <button class="icon-btn btn-sm" id="expand-B" title="Symbolization">⚙</button>
        <button class="icon-btn btn-sm" id="clear-B"  title="Remove">✕</button>
      </div>
      <div class="layer-settings" id="settings-B"></div>

      <div class="layer-row">
        <span class="slot-badge badge-C">C</span>
        <span class="layer-name" id="name-C">Empty</span>
        <button class="icon-btn" id="vis-C"    title="Toggle visibility">👁</button>
        <button class="icon-btn btn-sm" id="expand-C" title="Symbolization">⚙</button>
        <button class="icon-btn btn-sm" id="clear-C"  title="Remove">✕</button>
      </div>
      <div class="layer-settings" id="settings-C"></div>
    </div>

    <!-- Basemaps -->
    <div class="sb-section">
      <h3>Basemaps</h3>
      <div class="bm-row"><input type="radio" name="bm" id="bm-dark" value="dark" checked><label for="bm-dark">Dark (CartoDB)</label></div>
      <div class="bm-row"><input type="radio" name="bm" id="bm-osm"  value="osm"><label for="bm-osm">OpenStreetMap</label></div>
      <div class="bm-row"><input type="radio" name="bm" id="bm-sat"  value="sat"><label for="bm-sat">Satellite (Esri)</label></div>
      <div class="bm-row"><input type="radio" name="bm" id="bm-none" value="none"><label for="bm-none">None</label></div>

      <div class="wms-sub">
        <div class="bm-row" style="margin-top:6px;">
          <input type="checkbox" id="wms-on">
          <label for="wms-on" style="font-size:0.78rem;">NRCan Elevation WMS</label>
        </div>
        <select id="wms-layer">
          <option value="dtm-hillshade">DTM Hillshade</option>
          <option value="dsm-hillshade">DSM Hillshade</option>
          <option value="dtm">DTM (elevation)</option>
          <option value="dsm">DSM (surface)</option>
          <option value="dtm-slope">DTM Slope</option>
          <option value="dtm-aspect">DTM Aspect</option>
        </select>
        <div class="op-row">
          <span>Opacity</span>
          <input id="wms-opacity" type="range" min="0" max="100" value="70">
          <span id="wms-op-lbl">70%</span>
        </div>
      </div>
    </div>

  </div><!-- /sidebar -->

  <!-- ══ MAP ══ -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="info-box" style="display:none"></div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════════════ */
const COLORMAPS = {
  grayscale:  [[0,0,0],[255,255,255]],
  viridis:    [[68,1,84],[72,40,120],[62,83,160],[49,123,186],[38,158,199],
               [31,188,210],[53,213,186],[109,228,149],[180,237,104],[253,231,37]],
  plasma:     [[13,8,135],[84,2,163],[139,10,165],[185,50,137],[219,92,104],
               [244,136,73],[254,188,43],[240,249,33]],
  inferno:    [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],
               [245,125,21],[252,192,74],[252,255,164]],
  magma:      [[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],
               [229,80,100],[251,136,97],[254,194,135],[252,253,191]],
  hot:        [[10,0,0],[128,0,0],[255,0,0],[255,128,0],[255,255,0],[255,255,255]],
  rdylgn:     [[165,0,38],[215,48,39],[244,109,67],[253,174,97],[254,224,139],
               [217,239,139],[166,217,106],[102,189,99],[26,152,80],[0,104,55]],
  spectral:   [[158,1,66],[213,62,79],[244,109,67],[253,174,97],[254,224,139],
               [230,245,152],[171,221,164],[102,194,165],[50,136,189],[94,79,162]],
  rdbu:       [[178,24,43],[214,96,77],[244,165,130],[253,219,199],
               [209,229,240],[146,197,222],[67,147,195],[33,102,172]],
  coolwarm:   [[59,76,192],[98,130,234],[141,176,254],[184,208,249],
               [220,217,193],[245,177,139],[235,120,83],[180,4,38]],
  blues:      [[247,251,255],[198,219,239],[107,174,214],[33,113,181],[8,48,107]],
  greens:     [[247,252,245],[199,233,192],[116,196,118],[35,139,69],[0,88,36]],
  ylgnbu:     [[255,255,217],[199,233,180],[65,182,196],[34,94,168],[12,44,132]],
  terrain:    [[51,102,0],[102,153,51],[153,204,102],[204,255,153],
               [204,204,102],[255,255,204],[204,204,204],[255,255,255]],
  jet:        [[0,0,127],[0,0,255],[0,127,255],[0,255,255],
               [127,255,127],[255,255,0],[255,127,0],[255,0,0],[127,0,0]],
};

const BLEND_MODES = [
  'normal','multiply','screen','overlay','darken','lighten',
  'color-dodge','color-burn','hard-light','soft-light',
  'difference','exclusion',
];

const STRETCH_MODES = [
  { value: 'percentile', label: 'Percentile clip' },
  { value: 'minmax',     label: 'Min–Max' },
  { value: 'stddev',     label: 'Std Dev' },
  { value: 'manual',     label: 'Manual' },
];

/* ═══════════════════════════════════════════════════════════════════════
   COLORMAP UTILS
═══════════════════════════════════════════════════════════════════════ */
function sampleCmap(name, t) {
  const stops = COLORMAPS[name] || COLORMAPS.viridis;
  t = Math.max(0, Math.min(1, t));
  const idx = t * (stops.length - 1);
  const lo = stops[Math.floor(idx)];
  const hi = stops[Math.min(stops.length - 1, Math.ceil(idx))];
  const f = idx - Math.floor(idx);
  return [
    Math.round(lo[0] + f * (hi[0] - lo[0])),
    Math.round(lo[1] + f * (hi[1] - lo[1])),
    Math.round(lo[2] + f * (hi[2] - lo[2])),
  ];
}

function drawCmapPreview(canvas, name) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  for (let x = 0; x < canvas.width; x++) {
    const [r, g, b] = sampleCmap(name, x / (canvas.width - 1));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, 0, 1, canvas.height);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   MAP + PANES
═══════════════════════════════════════════════════════════════════════ */
const map = L.map('map', { center: [20, 0], zoom: 2 });

// One pane per slot so blend mode can be set independently
const SLOT_KEYS = ['A', 'B', 'C'];
SLOT_KEYS.forEach((k, i) => {
  map.createPane('pane-' + k);
  map.getPane('pane-' + k).style.zIndex = String(401 + i);
});

const BASEMAP_TILES = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 22 }),
  osm:  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19 }),
  sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri', maxZoom: 19 }),
};
BASEMAP_TILES.dark.addTo(map);
let activeBm = 'dark';

let wmsLayer = null;
function syncWms() {
  if (wmsLayer) { map.removeLayer(wmsLayer); wmsLayer = null; }
  if (!document.getElementById('wms-on').checked) return;
  const opacity = parseInt(document.getElementById('wms-opacity').value) / 100;
  wmsLayer = L.tileLayer.wms('https://datacube.services.geo.ca/ows/elevation', {
    layers: document.getElementById('wms-layer').value,
    format: 'image/png', transparent: true, version: '1.3.0',
    attribution: '© Natural Resources Canada', opacity,
  });
  wmsLayer.addTo(map);
}

/* ═══════════════════════════════════════════════════════════════════════
   PROJECTION
═══════════════════════════════════════════════════════════════════════ */
async function ensureProjection(epsg) {
  if (!epsg || epsg === 4326 || epsg === 3857) return;
  try {
    if (proj4.defs('EPSG:' + epsg)) return;
    const res = await fetch(`https://epsg.io/${epsg}.proj4`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    proj4.defs('EPSG:' + epsg, await res.text());
  } catch (e) { console.warn('ensureProjection EPSG:' + epsg, e); }
}

/* ═══════════════════════════════════════════════════════════════════════
   STATISTICS + STRETCH
═══════════════════════════════════════════════════════════════════════ */

// gr.values[band] can be a 2-D array (rows × TypedArrays) or a flat TypedArray.
function sampleBand(bandData, nd, maxSamples = 50000) {
  if (!bandData) return [];
  const valid = [];
  const is2D = Array.isArray(bandData[0]) || ArrayBuffer.isView(bandData[0]);
  if (is2D) {
    const nRows = bandData.length;
    const nCols = bandData[0]?.length ?? 1;
    const step  = Math.max(1, Math.floor((nRows * nCols) / maxSamples));
    let idx = 0;
    for (const row of bandData) {
      for (const v of row) {
        if (idx++ % step === 0 && v !== nd && !isNaN(v) && isFinite(v)) valid.push(v);
      }
    }
  } else {
    const step = Math.max(1, Math.floor(bandData.length / maxSamples));
    for (let i = 0; i < bandData.length; i += step) {
      const v = bandData[i];
      if (v !== nd && !isNaN(v) && isFinite(v)) valid.push(v);
    }
  }
  return valid;
}

function computeStretchStats(samples, mode, params) {
  if (!samples || !samples.length) return null;
  switch (mode) {
    case 'minmax': {
      let mn = Infinity, mx = -Infinity;
      for (const v of samples) { if (v < mn) mn = v; if (v > mx) mx = v; }
      return { min: mn, max: mx };
    }
    case 'percentile': {
      const sorted = Float64Array.from(samples).sort();
      const lo = Math.max(0, Math.min(49, params.pLo ?? 2));
      const hi = Math.min(100, Math.max(51, params.pHi ?? 98));
      return {
        min: sorted[Math.round(sorted.length * lo / 100)],
        max: sorted[Math.round(sorted.length * hi / 100) - 1] ?? sorted[sorted.length - 1],
      };
    }
    case 'stddev': {
      const n    = samples.length;
      const mean = samples.reduce((s, v) => s + v, 0) / n;
      const std  = Math.sqrt(samples.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
      const ns   = params.nSigma ?? 2;
      return { min: mean - ns * std, max: mean + ns * std };
    }
    case 'manual':
      return { min: params.manMin ?? 0, max: params.manMax ?? 1 };
    default:
      return null;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   SLOT STATE
═══════════════════════════════════════════════════════════════════════ */
const slots = { A: null, B: null, C: null };

/*
  slot state shape:
  { gr, leafletLayer, rawSamples[],  // flat samples per band
    bandStats[],                      // current {min,max} per band
    visible, band, colormap, opacity,
    stretchMode, pLo, pHi, nSigma, manMin, manMax,
    blendMode, url }
*/

function filename(url) {
  try { return new URL(url).pathname.split('/').pop().replace(/_cog\.tif$/i, '') || url; }
  catch { return url; }
}

function applyBlend(key, mode) {
  const pane = map.getPane('pane-' + key);
  if (pane) pane.style.mixBlendMode = mode;
}

/* ═══════════════════════════════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════════════════════════════ */

// Build a color function that reads from a mutable config object.
// Mutate cfg then call layer.updateColors(makeColorFn(gr, cfg)) to redraw
// without destroying the layer.
function makeColorFn(gr, cfg) {
  const nd = gr.noDataValue;
  return values => {
    const v = values[cfg.band];
    if (v == null || (nd != null && v === nd) || isNaN(v) || !isFinite(v)) return null;
    const { min, max } = cfg;
    const [r, g, b] = sampleCmap(cfg.colormap, Math.max(0, Math.min(1, (v - min) / (max - min || 1))));
    return `rgb(${r},${g},${b})`;
  };
}

function buildLeafletLayer(gr, cfg, { opacity = 1, pane = 'overlayPane' } = {}) {
  return new GeoRasterLayer({
    georaster: gr, opacity, resolution: 128, pane,
    pixelValuesToColorFn: makeColorFn(gr, cfg),
  });
}

// Recompute stretch for the active band and redraw via updateColors — no layer rebuild.
function updateSlotColors(key) {
  const s = slots[key];
  if (!s?.leafletLayer) return;
  const params = { pLo: s.pLo, pHi: s.pHi, nSigma: s.nSigma, manMin: s.manMin, manMax: s.manMax };
  const stats  = computeStretchStats(s.rawSamples[s.band] ?? [], s.stretchMode, params)
               ?? s.bandStats[s.band]   // keep last valid stats if recompute failed
               ?? { min: 0, max: 1 };
  s.bandStats[s.band] = stats;
  Object.assign(s.colorCfg, { band: s.band, colormap: s.colormap, min: stats.min, max: stats.max });
  s.leafletLayer.updateColors(makeColorFn(s.gr, s.colorCfg));
}

/* ═══════════════════════════════════════════════════════════════════════
   LOAD / CLEAR
═══════════════════════════════════════════════════════════════════════ */
async function loadSlot(key, url) {
  setStatus(`Loading ${key}…`);
  document.getElementById('load-btn').disabled = true;
  try {
    if (slots[key]?.leafletLayer) map.removeLayer(slots[key].leafletLayer);

    const gr = await parseGeoraster(url);
    await ensureProjection(gr.projection);

    const nd = gr.noDataValue;

    // Sample pixel values — gr.values may be empty for pure COG metadata loads,
    // so fall back to georaster's built-in min/max arrays.
    const rawSamples = (gr.values || []).map(b => sampleBand(b, nd));

    const bandStats = rawSamples.map((samp, i) => {
      if (samp.length > 0) {
        return computeStretchStats(samp, 'percentile', { pLo: 2, pHi: 98 }) ?? { min: 0, max: 1 };
      }
      // Fallback: georaster often exposes per-band mins/maxs from TIFF metadata
      if (gr.mins?.[i] != null && gr.maxs?.[i] != null && gr.maxs[i] !== gr.mins[i]) {
        return { min: gr.mins[i], max: gr.maxs[i] };
      }
      return { min: 0, max: 1 };
    });

    // colorCfg is mutated in-place by updateSlotColors — the color fn closes over it
    const colorCfg = { band: 0, colormap: 'viridis', min: bandStats[0].min, max: bandStats[0].max };
    const lyr = buildLeafletLayer(gr, colorCfg, { opacity: 1, pane: 'pane-' + key });
    lyr.addTo(map);
    map.fitBounds(lyr.getBounds());

    slots[key] = {
      gr, leafletLayer: lyr, colorCfg, rawSamples, bandStats,
      visible: true, band: 0, colormap: 'viridis', opacity: 1,
      stretchMode: 'percentile', pLo: 2, pHi: 98, nSigma: 2, manMin: null, manMax: null,
      blendMode: 'normal', url,
    };
    document.getElementById('name-' + key).textContent = filename(url);
    document.getElementById('name-' + key).classList.add('loaded');
    buildLayerSettings(key);
    setStatus(`${key}: ${filename(url)} — ${gr.numberOfRasters}b ${gr.width}×${gr.height} EPSG:${gr.projection||'?'}`, 'ok');
  } catch (err) {
    setStatus('Error: ' + (err?.message || String(err)), 'error');
    console.error(err);
  } finally {
    document.getElementById('load-btn').disabled = false;
  }
}

function clearSlot(key) {
  if (!slots[key]) return;
  if (slots[key].leafletLayer) map.removeLayer(slots[key].leafletLayer);
  slots[key] = null;
  document.getElementById('name-' + key).textContent = 'Empty';
  document.getElementById('name-' + key).classList.remove('loaded');
  const se = document.getElementById('settings-' + key);
  se.innerHTML = ''; se.classList.remove('open');
  document.getElementById('vis-' + key).classList.remove('dim');
}

/* ═══════════════════════════════════════════════════════════════════════
   LAYER SETTINGS PANEL
═══════════════════════════════════════════════════════════════════════ */
function buildLayerSettings(key) {
  const s = slots[key];
  if (!s) return;
  const n = s.gr.numberOfRasters;
  const container = document.getElementById('settings-' + key);

  // Build option lists
  const bandOpts = Array.from({ length: n }, (_, i) =>
    `<option value="${i}"${i === s.band ? ' selected' : ''}>Band ${i + 1}</option>`).join('');
  const cmapOpts = Object.keys(COLORMAPS).map(k =>
    `<option value="${k}"${k === s.colormap ? ' selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('');
  const blendOpts = BLEND_MODES.map(m =>
    `<option value="${m}"${m === s.blendMode ? ' selected' : ''}>${m[0].toUpperCase() + m.slice(1)}</option>`).join('');
  const stretchOpts = STRETCH_MODES.map(({ value, label }) =>
    `<option value="${value}"${value === s.stretchMode ? ' selected' : ''}>${label}</option>`).join('');

  container.innerHTML = `
    ${n > 1 ? `<label>Band <select class="ls-select" id="band-${key}">${bandOpts}</select></label>` : ''}

    <label>Colormap</label>
    <div class="cmap-row">
      <select class="ls-select" id="cmap-${key}">${cmapOpts}</select>
      <canvas id="cprev-${key}" class="cmap-preview" width="72" height="13"></canvas>
    </div>

    <label>Stretch <select class="ls-select" id="stretch-${key}">${stretchOpts}</select></label>
    <div class="stretch-params" id="sparam-${key}"></div>

    <label>Blend <select class="ls-select" id="blend-${key}">${blendOpts}</select></label>

    <label>Opacity
      <input type="range" class="ls-range" id="op-${key}" min="0" max="100" value="${Math.round(s.opacity * 100)}">
      <span id="oplbl-${key}">${Math.round(s.opacity * 100)}%</span>
    </label>`;

  drawCmapPreview(document.getElementById('cprev-' + key), s.colormap);
  buildStretchParams(key);

  // ── Events ──
  if (n > 1) {
    document.getElementById('band-' + key).addEventListener('change', e => {
      s.band = parseInt(e.target.value);
      updateSlotColors(key);
      buildStretchParams(key); // refresh hint for new band
    });
  }
  document.getElementById('cmap-' + key).addEventListener('change', e => {
    s.colormap = e.target.value;
    drawCmapPreview(document.getElementById('cprev-' + key), s.colormap);
    updateSlotColors(key);
  });
  document.getElementById('stretch-' + key).addEventListener('change', e => {
    s.stretchMode = e.target.value;
    updateSlotColors(key);
    buildStretchParams(key); // rebuild param inputs for new mode
  });
  document.getElementById('blend-' + key).addEventListener('change', e => {
    s.blendMode = e.target.value;
    applyBlend(key, s.blendMode); // CSS only — no layer rebuild
  });
  const opSl  = document.getElementById('op-' + key);
  const opLbl = document.getElementById('oplbl-' + key);
  opSl.addEventListener('input', () => {
    s.opacity = parseInt(opSl.value) / 100;
    opLbl.textContent = opSl.value + '%';
    s.leafletLayer?.setOpacity(s.opacity); // setOpacity — no layer rebuild
  });
}

function buildStretchParams(key) {
  const s = slots[key];
  if (!s) return;
  const container = document.getElementById('sparam-' + key);
  if (!container) return;

  // Show the current data range as a hint
  const bs = s.bandStats[s.band];
  const hint = bs ? ` <span style="color:#555">[${bs.min.toFixed(2)}–${bs.max.toFixed(2)}]</span>` : '';

  switch (s.stretchMode) {
    case 'percentile':
      container.innerHTML = `
        <span>Lo</span>
        <input type="number" class="ls-num" id="plo-${key}" min="0" max="49" step="1" value="${s.pLo}">
        <span>Hi</span>
        <input type="number" class="ls-num" id="phi-${key}" min="51" max="100" step="1" value="${s.pHi}">
        <span>%${hint}</span>`;
      document.getElementById('plo-' + key).addEventListener('change', e => {
        s.pLo = parseFloat(e.target.value) || 2; updateSlotColors(key); buildStretchParams(key);
      });
      document.getElementById('phi-' + key).addEventListener('change', e => {
        s.pHi = parseFloat(e.target.value) || 98; updateSlotColors(key); buildStretchParams(key);
      });
      break;

    case 'minmax':
      container.innerHTML = `<span style="color:#666">Full data range${hint}</span>`;
      break;

    case 'stddev':
      container.innerHTML = `
        <span>±</span>
        <input type="number" class="ls-num" id="nsig-${key}" min="0.5" max="6" step="0.5" value="${s.nSigma}">
        <span>σ${hint}</span>`;
      document.getElementById('nsig-' + key).addEventListener('change', e => {
        s.nSigma = parseFloat(e.target.value) || 2; updateSlotColors(key); buildStretchParams(key);
      });
      break;

    case 'manual': {
      const mn = s.manMin ?? (bs?.min ?? 0);
      const mx = s.manMax ?? (bs?.max ?? 1);
      container.innerHTML = `
        <span>Min</span>
        <input type="number" class="ls-num" id="mmin-${key}" value="${mn.toFixed(4)}" step="any">
        <span>Max</span>
        <input type="number" class="ls-num" id="mmax-${key}" value="${mx.toFixed(4)}" step="any">`;
      document.getElementById('mmin-' + key).addEventListener('change', e => {
        s.manMin = parseFloat(e.target.value); updateSlotColors(key); buildStretchParams(key);
      });
      document.getElementById('mmax-' + key).addEventListener('change', e => {
        s.manMax = parseFloat(e.target.value); updateSlotColors(key); buildStretchParams(key);
      });
      break;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   PIXEL HOVER
═══════════════════════════════════════════════════════════════════════ */
function getValuesAtLatLng(gr, latlng) {
  let x = latlng.lng, y = latlng.lat;
  const epsg = gr.projection;
  if (epsg && epsg !== 4326 && epsg !== 0) {
    try { [x, y] = proj4('EPSG:4326', 'EPSG:' + epsg, [latlng.lng, latlng.lat]); }
    catch { return null; }
  }
  const { xmin, xmax, ymin, ymax, width, height, values, noDataValue } = gr;
  if (x < xmin || x > xmax || y < ymin || y > ymax) return null;
  const col = Math.floor((x - xmin) / (xmax - xmin) * width);
  const row = Math.floor((ymax - y) / (ymax - ymin) * height);
  return values.map(band => {
    const v = band[row]?.[col];
    return (v === undefined || v === noDataValue) ? null : v;
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   UI WIRING
═══════════════════════════════════════════════════════════════════════ */
const statusEl = document.getElementById('status');
const infoBox  = document.getElementById('info-box');
function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }

// Header load button
document.getElementById('load-btn').addEventListener('click', () => {
  const url = document.getElementById('url-input').value.trim();
  if (url) loadSlot(document.getElementById('slot-select').value, url);
});
document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('load-btn').click();
});

// Preset buttons
['A', 'B', 'C'].forEach(k => {
  const btn = document.getElementById('pre-' + k);
  btn.addEventListener('click', () => loadSlot(btn.dataset.slot, btn.dataset.url));
});
document.getElementById('pre-all').addEventListener('click', () => {
  ['A', 'B', 'C'].forEach(k => {
    const btn = document.getElementById('pre-' + k);
    loadSlot(btn.dataset.slot, btn.dataset.url);
  });
});

// Per-slot visibility / expand / clear
SLOT_KEYS.forEach(k => {
  document.getElementById('vis-' + k).addEventListener('click', () => {
    const s = slots[k]; if (!s) return;
    s.visible = !s.visible;
    s.visible ? s.leafletLayer?.addTo(map) : (s.leafletLayer && map.removeLayer(s.leafletLayer));
    document.getElementById('vis-' + k).classList.toggle('dim', !s.visible);
  });
  document.getElementById('expand-' + k).addEventListener('click', () => {
    document.getElementById('settings-' + k).classList.toggle('open');
  });
  document.getElementById('clear-' + k).addEventListener('click', () => clearSlot(k));
});

// Basemap radio
document.querySelectorAll('input[name="bm"]').forEach(r => {
  r.addEventListener('change', () => {
    if (BASEMAP_TILES[activeBm]) map.removeLayer(BASEMAP_TILES[activeBm]);
    activeBm = r.value;
    if (BASEMAP_TILES[activeBm]) BASEMAP_TILES[activeBm].addTo(map);
  });
});

// WMS controls
document.getElementById('wms-on').addEventListener('change', syncWms);
document.getElementById('wms-layer').addEventListener('change', () => {
  if (document.getElementById('wms-on').checked) syncWms();
});
document.getElementById('wms-opacity').addEventListener('input', function () {
  document.getElementById('wms-op-lbl').textContent = this.value + '%';
  if (wmsLayer) wmsLayer.setOpacity(parseInt(this.value) / 100);
});

// Hover info
map.on('mousemove', e => {
  const active = SLOT_KEYS.filter(k => slots[k]?.gr && slots[k].visible);
  if (!active.length) { infoBox.style.display = 'none'; return; }
  let rows = `<tr><td>Lat</td><td>${e.latlng.lat.toFixed(5)}</td></tr>
              <tr><td>Lng</td><td>${e.latlng.lng.toFixed(5)}</td></tr>`;
  active.forEach(k => {
    const vals = getValuesAtLatLng(slots[k].gr, e.latlng);
    if (!vals) return;
    vals.forEach((v, i) => {
      const lbl = slots[k].gr.numberOfRasters > 1 ? `${k} b${i + 1}` : k;
      rows += `<tr><td>${lbl}</td><td>${v !== null ? v.toFixed(4) : 'nd'}</td></tr>`;
    });
  });
  infoBox.innerHTML = `<table>${rows}</table>`;
  infoBox.style.display = 'block';
});
</script>
</body>
</html>
