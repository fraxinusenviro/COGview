<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COG Viewer</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- proj4 (must be global so georaster-layer-for-leaflet can find it) -->
  <script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>

  <!-- georaster (bundles geotiff v1 internally) -->
  <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>

  <!-- georaster-layer-for-leaflet (bundles its own geotiff v2) -->
  <script src="https://unpkg.com/georaster-layer-for-leaflet@4.1.2/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    header {
      padding: 10px 16px;
      background: #16213e;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #0f3460;
      z-index: 1000;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e94560;
      white-space: nowrap;
    }

    #url-input {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #e0e0e0;
      font-size: 0.9rem;
    }

    #url-input:focus {
      outline: none;
      border-color: #e94560;
    }

    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    #load-btn {
      background: #e94560;
      color: #fff;
    }

    #load-btn:hover { background: #c73652; }
    #load-btn:disabled { background: #555; cursor: not-allowed; }

    #clear-btn {
      background: #0f3460;
      color: #e0e0e0;
    }

    #clear-btn:hover { background: #1a4a80; }

    #status {
      font-size: 0.8rem;
      color: #aaa;
      white-space: nowrap;
    }

    #status.error { color: #e94560; }
    #status.ok    { color: #4caf50; }

    #map {
      flex: 1;
    }

    /* Band / colormap controls */
    #controls {
      display: none;
      padding: 8px 16px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.85rem;
    }

    #controls.visible { display: flex; }

    label { color: #aaa; margin-right: 4px; }

    select, input[type=range] {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a80;
      border-radius: 4px;
      padding: 2px 6px;
    }

    #info-box {
      position: absolute;
      bottom: 24px;
      right: 8px;
      background: rgba(22,33,62,0.92);
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.78rem;
      z-index: 900;
      max-width: 260px;
      pointer-events: none;
    }

    #info-box table { border-collapse: collapse; }
    #info-box td { padding: 1px 6px 1px 0; }
    #info-box td:first-child { color: #aaa; }
  </style>
</head>
<body>

<header>
  <h1>COG Viewer</h1>
  <input id="url-input" type="text"
    placeholder="Enter a Cloud Optimized GeoTIFF URL and press Load…"
    value="https://nswetlands-mapping.s3.us-east-2.amazonaws.com/COG/GEI_cog.tif"
  />
  <button id="load-btn">Load</button>
  <button id="clear-btn">Clear</button>
  <span id="status">Enter a COG URL above.</span>
</header>

<div id="controls">
  <div>
    <label for="band-select">Band</label>
    <select id="band-select"></select>
  </div>
  <div>
    <label for="colormap-select">Colormap</label>
    <select id="colormap-select">
      <option value="none">None (grayscale)</option>
      <option value="viridis">Viridis</option>
      <option value="plasma">Plasma</option>
      <option value="rdylgn">RdYlGn</option>
      <option value="spectral">Spectral</option>
    </select>
  </div>
  <div>
    <label>Opacity</label>
    <input id="opacity-slider" type="range" min="0" max="100" value="100" style="width:80px" />
    <span id="opacity-label">100%</span>
  </div>
</div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;">
  <div id="map"></div>
  <div id="info-box" style="display:none"></div>
</div>

<script>
/* ── Colormaps ─────────────────────────────────────────────────────────── */
const COLORMAPS = {
  viridis: [
    [68,1,84],[72,40,120],[62,83,160],[49,123,186],[38,158,199],
    [31,188,210],[53,213,186],[109,228,149],[180,237,104],[253,231,37]
  ],
  plasma: [
    [13,8,135],[84,2,163],[139,10,165],[185,50,137],[219,92,104],
    [244,136,73],[254,188,43],[240,249,33]
  ],
  rdylgn: [
    [165,0,38],[215,48,39],[244,109,67],[253,174,97],[254,224,139],
    [217,239,139],[166,217,106],[102,189,99],[26,152,80],[0,104,55]
  ],
  spectral: [
    [158,1,66],[213,62,79],[244,109,67],[253,174,97],[254,224,139],
    [230,245,152],[171,221,164],[102,194,165],[50,136,189],[94,79,162]
  ]
};

function applyColormap(value, min, max, name) {
  const stops = COLORMAPS[name];
  const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const idx = t * (stops.length - 1);
  const lo = stops[Math.floor(idx)];
  const hi = stops[Math.min(stops.length - 1, Math.ceil(idx))];
  const f = idx - Math.floor(idx);
  return [
    Math.round(lo[0] + f * (hi[0] - lo[0])),
    Math.round(lo[1] + f * (hi[1] - lo[1])),
    Math.round(lo[2] + f * (hi[2] - lo[2]))
  ];
}

/* ── Map setup ─────────────────────────────────────────────────────────── */
const map = L.map('map', { center: [20, 0], zoom: 2 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  maxZoom: 22
}).addTo(map);

/* ── State ─────────────────────────────────────────────────────────────── */
let currentLayer = null;
let currentGeoRaster = null;
let bandCount = 1;
let bandStats = []; // [{min, max}, …] one per band

/* Fetch and register a proj4 definition for an EPSG code if not already known */
async function ensureProjection(epsg) {
  if (!epsg || epsg === 4326 || epsg === 3857) return;
  try {
    // Check if already defined (proj4.defs returns undefined for unknown codes)
    if (proj4.defs('EPSG:' + epsg)) return;
    const res = await fetch(`https://epsg.io/${epsg}.proj4`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const def = await res.text();
    proj4.defs('EPSG:' + epsg, def);
  } catch (e) {
    console.warn(`Could not register EPSG:${epsg}`, e);
  }
}

async function computeBandStats(georaster) {
  const n = georaster.numberOfRasters;
  const fallback = Array.from({ length: n }, () => ({ min: 0, max: 255 }));

  // 1. Use embedded stats if present and non-trivial for all bands
  if (Array.isArray(georaster.mins) && Array.isArray(georaster.maxs) &&
      georaster.mins.length >= n && georaster.maxs.length >= n &&
      georaster.mins.every((v, i) => v != null && georaster.maxs[i] != null && v !== georaster.maxs[i])) {
    return georaster.mins.map((min, i) => ({ min, max: georaster.maxs[i] }));
  }

  // 2. Read smallest overview via the internal geotiff object georaster exposes
  try {
    const tiff = georaster._geotiff || georaster.geotiff;
    if (!tiff) throw new Error('no internal geotiff');
    const imageCount = await tiff.getImageCount();
    const overview = await tiff.getImage(imageCount - 1);
    const rasters = await overview.readRasters();
    const nd = georaster.noDataValue;
    return Array.from({ length: n }, (_, i) => {
      const band = rasters[i];
      if (!band) return fallback[i];
      let min = Infinity, max = -Infinity;
      for (const v of band) {
        if (v === nd || v == null || isNaN(v)) continue;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      return isFinite(min) ? { min, max } : fallback[i];
    });
  } catch (e) {
    console.warn('Could not compute band stats:', e);
    return fallback;
  }
}

const urlInput      = document.getElementById('url-input');
const loadBtn       = document.getElementById('load-btn');
const clearBtn      = document.getElementById('clear-btn');
const statusEl      = document.getElementById('status');
const controlsEl    = document.getElementById('controls');
const bandSelect    = document.getElementById('band-select');
const colormapSel   = document.getElementById('colormap-select');
const opacitySlider = document.getElementById('opacity-slider');
const opacityLabel  = document.getElementById('opacity-label');
const infoBox       = document.getElementById('info-box');

/* ── Helpers ───────────────────────────────────────────────────────────── */
function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type;
}

function removeCurrentLayer() {
  if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
}

function buildLayer(georaster) {
  const band     = parseInt(bandSelect.value, 10) || 0;
  const cmap     = colormapSel.value;
  const opacity  = parseInt(opacitySlider.value, 10) / 100;
  const isRGB    = bandCount >= 3 && cmap === 'none' && band === -1;

  const opts = {
    georaster,
    opacity,
    resolution: 256,
  };

  if (isRGB) {
    // True-colour composite using first three bands
    opts.pixelValuesToColorFn = values => {
      if (values[0] === georaster.noDataValue) return null;
      const r = Math.min(255, Math.max(0, values[0]));
      const g = Math.min(255, Math.max(0, values[1]));
      const b = Math.min(255, Math.max(0, values[2]));
      return `rgb(${r},${g},${b})`;
    };
  } else {
    const b = band === -1 ? 0 : band;
    const { min, max } = bandStats[b] || { min: 0, max: 255 };
    opts.pixelValuesToColorFn = values => {
      const v = values[b];
      if (v === georaster.noDataValue || v === undefined) return null;
      if (cmap !== 'none') {
        const [r, g, bl] = applyColormap(v, min, max, cmap);
        return `rgb(${r},${g},${bl})`;
      }
      const t = Math.round(255 * Math.max(0, Math.min(1, (v - min) / (max - min))));
      return `rgb(${t},${t},${t})`;
    };
  }

  return new GeoRasterLayer(opts);
}

async function loadCOG(url) {
  removeCurrentLayer();
  setStatus('Loading…');
  loadBtn.disabled = true;
  controlsEl.classList.remove('visible');
  infoBox.style.display = 'none';

  try {
    const georaster = await parseGeoraster(url);
    currentGeoRaster = georaster;
    bandCount = georaster.numberOfRasters;
    bandStats = await computeBandStats(georaster);

    /* Populate band selector */
    bandSelect.innerHTML = '';
    if (bandCount >= 3) {
      const opt = document.createElement('option');
      opt.value = -1; opt.textContent = 'RGB (bands 1-2-3)';
      bandSelect.appendChild(opt);
    }
    for (let i = 0; i < bandCount; i++) {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = `Band ${i + 1}`;
      bandSelect.appendChild(opt);
    }

    await ensureProjection(georaster.projection);
    currentLayer = buildLayer(georaster);
    currentLayer.addTo(map);
    map.fitBounds(currentLayer.getBounds());

    controlsEl.classList.add('visible');
    setStatus(
      `Loaded — ${bandCount} band${bandCount > 1 ? 's' : ''}, ` +
      `${georaster.width}×${georaster.height}px, ` +
      `EPSG:${georaster.projection || '?'}`,
      'ok'
    );

    /* Info box on hover */
    map.on('mousemove', e => {
      if (!currentGeoRaster) return;
      const vals = getValuesAtLatLng(currentGeoRaster, e.latlng);
      if (!vals) { infoBox.style.display = 'none'; return; }
      let rows = `<tr><td>Lat</td><td>${e.latlng.lat.toFixed(5)}</td></tr>
                  <tr><td>Lng</td><td>${e.latlng.lng.toFixed(5)}</td></tr>`;
      vals.forEach((v, i) => {
        rows += `<tr><td>Band ${i+1}</td><td>${v !== null ? v.toFixed(2) : 'nodata'}</td></tr>`;
      });
      infoBox.innerHTML = `<table>${rows}</table>`;
      infoBox.style.display = 'block';
    });

  } catch (err) {
    const msg = err?.message || (typeof err === 'string' ? err : JSON.stringify(err));
    setStatus('Error: ' + msg, 'error');
    console.error(err);
  } finally {
    loadBtn.disabled = false;
  }
}

/* Rough nearest-neighbour pixel lookup */
function getValuesAtLatLng(gr, latlng) {
  const { xmin, xmax, ymin, ymax, width, height, values, noDataValue } = gr;
  const lng = latlng.lng;
  const lat = latlng.lat;
  if (lng < xmin || lng > xmax || lat < ymin || lat > ymax) return null;
  const col = Math.floor((lng - xmin) / (xmax - xmin) * width);
  const row = Math.floor((ymax - lat) / (ymax - ymin) * height);
  return values.map(band => {
    const v = band[row]?.[col];
    return (v === undefined || v === noDataValue) ? null : v;
  });
}

/* ── Re-render on control changes ──────────────────────────────────────── */
function rerender() {
  if (!currentGeoRaster) return;
  removeCurrentLayer();
  currentLayer = buildLayer(currentGeoRaster);
  currentLayer.addTo(map);
}

bandSelect.addEventListener('change', rerender);
colormapSel.addEventListener('change', rerender);
opacitySlider.addEventListener('input', () => {
  opacityLabel.textContent = opacitySlider.value + '%';
  if (currentLayer) currentLayer.setOpacity(parseInt(opacitySlider.value, 10) / 100);
});

/* ── Button handlers ───────────────────────────────────────────────────── */
loadBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (url) loadCOG(url);
});

clearBtn.addEventListener('click', () => {
  removeCurrentLayer();
  currentGeoRaster = null;
  map.off('mousemove');
  infoBox.style.display = 'none';
  controlsEl.classList.remove('visible');
  setStatus('Cleared.');
});

urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') loadBtn.click();
});
</script>
</body>
</html>
